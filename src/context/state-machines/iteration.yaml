apiVersion: processkit.projectious.work/v2
kind: StateMachine
metadata: {id: SM-iteration, name: iteration, version: 1.0.0-alpha.3}
spec:
  initial: planned
  terminal: [completed, cancelled]
  states:
    planned: {transitions: [{to: active}, {to: cancelled}]}
    active: {transitions: [{to: reviewing}, {to: cancelled}]}
    reviewing: {transitions: [{to: completed}, {to: active}, {to: cancelled}]}
    completed: {transitions: []}
    cancelled: {transitions: []}
