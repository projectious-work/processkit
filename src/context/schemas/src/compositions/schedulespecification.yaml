extends: ../primitives/specification.yaml
apiVersion: processkit.projectious.work/v2
kind: Schema
metadata: {id: SCHEMA-schedulespecification, target_kind: ScheduleSpecification, version: 1.0.0-beta.1}
spec:
  description: A recurrence with timezone and calendar constraints.
  id_prefix: SCHEDSPEC
  default_directory: context/specifications/schedules
  spec_schema:
    required: {__merge: concat, value: [recurrence]}
    properties:
      __merge: name-merge
      value:
        kind: {const: schedule}
        recurrence: {type: string, minLength: 1}
        timezone: {type: [string, "null"]}
        constraints: {type: array, items: {type: string}}
