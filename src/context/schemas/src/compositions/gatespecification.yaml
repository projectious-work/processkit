extends: ../primitives/specification.yaml
apiVersion: processkit.projectious.work/v2
kind: Schema
metadata: {id: SCHEMA-gatespecification, target_kind: GateSpecification, version: 1.0.0-beta.1}
spec:
  description: A specification of policy, evidence, and pass/fail semantics.
  id_prefix: GATESPEC
  default_directory: context/specifications/gates
  spec_schema:
    required: {__merge: concat, value: [required_evidence]}
    properties:
      __merge: name-merge
      value:
        kind: {const: gate}
        policy: {type: [string, "null"]}
        required_evidence: {type: array, items: {type: string}}
        blocking: {type: boolean}
