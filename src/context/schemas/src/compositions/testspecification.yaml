extends: ../primitives/specification.yaml
apiVersion: processkit.projectious.work/v2
kind: Schema
metadata: {id: SCHEMA-testspecification, target_kind: TestSpecification, version: 1.0.0-beta.1}
spec:
  description: A fixture, expected result, and acceptance signal.
  id_prefix: TESTSPEC
  default_directory: context/specifications/tests
  spec_schema:
    required: {__merge: concat, value: [fixture, expected]}
    properties:
      __merge: name-merge
      value:
        kind: {const: test}
        fixture: {type: string, minLength: 1}
        expected: {}
        acceptance_signal: {type: [string, "null"]}
