extends: ../primitives/specification.yaml
apiVersion: processkit.projectious.work/v2
kind: Schema
metadata: {id: SCHEMA-channelspecification, target_kind: ChannelSpecification, version: 1.0.0-beta.1}
spec:
  description: A channel protocol, participant, and retention specification.
  id_prefix: CHANSPEC
  default_directory: context/specifications/channels
  spec_schema:
    required: {__merge: concat, value: [protocol]}
    properties:
      __merge: name-merge
      value:
        kind: {const: channel}
        protocol: {type: string, minLength: 1}
        participants: {type: array, items: {type: string}}
        retention: {type: [string, "null"]}
