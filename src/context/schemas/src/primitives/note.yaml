extends: [../fragments/entity.yaml, ../fragments/versioned.yaml]
apiVersion: processkit.projectious.work/v2
kind: Schema
metadata: {id: SCHEMA-note, target_kind: Note, version: 1.0.0-beta.1}
spec:
  description: Captured knowledge that may be promoted, linked, or archived.
  id_prefix: NOTE
  state_machine: note
  default_directory: context/notes
  known_kinds: [fleeting, reference, observation]
  spec_schema:
    type: object
    required: [title, state]
    additionalProperties: true
    properties:
      title: {type: string, minLength: 1}
      state: {type: string, enum: [captured, promoted, discarded]}
      kind: {type: string, enum: [fleeting, reference, observation]}
      promoted_to: {type: [string, "null"]}
