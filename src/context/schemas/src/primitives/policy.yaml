extends: [../fragments/entity.yaml, ../fragments/versioned.yaml]
apiVersion: processkit.projectious.work/v2
kind: Schema
metadata: {id: SCHEMA-policy, target_kind: Policy, version: 1.0.0-beta.1}
spec:
  description: A governing rule, standard, permission, or constraint.
  id_prefix: POLICY
  state_machine: null
  default_directory: context/policies
  known_kinds: [rule, standard, permission, constraint]
  spec_schema:
    type: object
    required: [name, statement]
    additionalProperties: true
    properties:
      name: {type: string, minLength: 1}
      statement: {type: string, minLength: 1}
      kind: {type: string, enum: [rule, standard, permission, constraint]}
      applies_to: {type: array, items: {type: string}}
