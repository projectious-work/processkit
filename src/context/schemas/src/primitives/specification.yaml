extends: [../fragments/entity.yaml, ../fragments/versioned.yaml]
apiVersion: processkit.projectious.work/v2
kind: Schema
metadata: {id: SCHEMA-specification, target_kind: Specification, version: 1.0.0-beta.1}
spec:
  description: A formal description of a governed process or contract.
  id_prefix: SPEC
  state_machine: null
  default_directory: context/specifications
  known_kinds: [process, goal, role, gate, schema, schedule, test, channel, queue]
  spec_schema:
    type: object
    required: [name, kind]
    additionalProperties: true
    properties:
      name: {type: string, minLength: 1}
      kind:
        type: string
        enum: [process, goal, role, gate, schema, schedule, test, channel, queue]
      owner: {type: [string, "null"]}
