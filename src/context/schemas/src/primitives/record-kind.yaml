extends: [../fragments/entity.yaml, ../fragments/record.yaml, ../fragments/versioned.yaml]
apiVersion: processkit.projectious.work/v2
kind: Schema
metadata: {id: SCHEMA-record, target_kind: Record, version: 1.0.0-beta.1}
spec:
  description: A durable process record and evidence family.
  id_prefix: REC
  state_machine: null
  default_directory: context/records
  known_kinds: [general, evidence, approval, history]
  spec_schema:
    type: object
    required: [title, kind]
    additionalProperties: true
    properties:
      title: {type: string, minLength: 1}
      kind: {type: string, enum: [general, evidence, approval, history]}
