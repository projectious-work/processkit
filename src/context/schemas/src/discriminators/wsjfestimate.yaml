extends: ../primitives/proposition.yaml
apiVersion: processkit.projectious.work/v2
kind: Schema
metadata: {id: SCHEMA-proposition-wsjfestimate, target_kind: Proposition, version: 1.0.0-beta.1}
spec:
  parent: Proposition
  discriminator: {field: kind, value: wsjf-estimate}
  description: A weighted shortest-job-first prioritization estimate.
  spec_schema:
    required: {__merge: concat, value: [cost_of_delay, job_size]}
    properties:
      __merge: name-merge
      value:
        kind: {const: wsjf-estimate}
        cost_of_delay: {type: number, minimum: 0}
        job_size: {type: number, exclusiveMinimum: 0}
        score: {type: number, minimum: 0}
