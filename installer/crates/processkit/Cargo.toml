[package]
name = "processkit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Manifest-driven processkit installer planner"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
walkdir = "2"
