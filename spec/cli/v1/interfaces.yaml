slug: cli
version: 1

# Everything the processkit CLI makes observable. Identifiers, options,
# defaults, and fields below are stated by the requirements, the #197
# baseline, the governance-draft gap items carried as PK-CLI-008 to
# PK-CLI-020, owner decisions, or company standards. Entries marked
# `basis: agent-proposal` are drafted answers to former open items (see
# overview.md, "Resolved open items"). Semantics of individual commands are
# owned by the slug named in `semantics_owner`.

executable: processkit

command_style:
  style: B (verb–resource, as in kubectl)
  standard: command-line-interface-design.md (company standards v2.2.0)
  adr: docs/adr/0001-cli-command-style.md
  grammar:
    resource_commands: processkit <verb> TYPE [NAME...] [options]
    type_slash_name: "TYPE/NAME is accepted wherever TYPE NAME is"
    non_resource_commands: [init, fetch, lock, migrate, mcp serve,
                            config view, version, api-resources,
                            auth whoami]
  options: every option has a long name; short forms -h, -o, -n, -A, -l,
    -f only; only --dry-run has an optional value
  interleaving: options are accepted before and after operands
  end_of_options: "--"
  stdin_operand: "-f - (validate and apply only)"
  plugins: none; processkit never executes processkit-<name> programs
  deviations: none
  basis: owner decision 2026-11-11 (#212)
  requirements: [PK-CLI-021, PK-CLI-024, PK-CLI-055]

type_names:
  # TYPE accepts any of these, compared case-insensitively. Extension kinds
  # declare plural and shortName in their OntologyExtension (ontology@v1).
  # A name, plural, or short name that collides with another entry or with
  # `context` is rejected by ontology@v1 validation.
  kinds:
    - {kind: Standard, plural: standards, short: std}
    - {kind: ProcessSpecification, plural: processspecifications,
       short: proc}
    - {kind: Skill, plural: skills, short: sk}
    - {kind: MCPServer, plural: mcpservers, short: mcp}
    - {kind: DecisionRecord, plural: decisionrecords, short: dr}
    - {kind: Document, plural: documents, short: doc}
    - {kind: Container, plural: containers, short: ctr}
    - {kind: Role, plural: roles, short: rl}
    - {kind: Binding, plural: bindings, short: bd}
    - {kind: OntologyExtension, plural: ontologyextensions, short: ext}
  virtual_types:
    - {name: context, verbs: [get], meaning: the assembled context of
       mcp-context-serving@v1 get_context; no stored resource, no NAME}
  concept_names: explain TYPE also accepts every concept name of the
    ontology registry, case-insensitively
  names: case-sensitive
  unknown_type: content-kinds.unknown-kind (usage)
  basis: agent-proposal (owner decision 2026-11-11, #212)
  requirements: [PK-CLI-049]

global_options:
  - name: -h, --help
    applies_to: every command
    effect: prints help that begins with examples to stdout; exit 0; other
      arguments ignored
    requirements: [PK-CLI-022]
  - name: --version
    applies_to: processkit (no command)
    effect: prints exactly one line "processkit <release>" to stdout; exit 0
    check: output equals "processkit " + data.release of
      processkit version -o json, followed by one LF
    requirements: [PK-CLI-023]
  - name: -o, --output
    value: "json | yaml | name | wide"
    applies_to: every command except mcp serve
    effect:
      json: standard output carries exactly one result envelope
        (schemas/result-envelope.schema.json)
      yaml: the same envelope as one YAML 1.2 document; its parsed value
        equals the parsed json output
      name: one line <Kind>/<namespace>/<name> per item in data, in data
        order; only get TYPE, create, apply, and format
      wide: text output with additional columns; not a contract
    default: text output; not a contract
    on_mcp_serve: usage error, cli.option-not-applicable
    name_elsewhere: usage error, cli.option-not-applicable
    check: with json, stdout parses as one JSON document valid against the
      envelope schema; names, digests, provenance, and diagnostics present
      in text output are also present in the envelope
    basis: agent-proposal (owner decision 2026-11-11, #212)
    requirements: [PK-CLI-002, PK-CLI-030, PK-CLI-050, PK-OUT-001,
                   PK-OUT-006]
  - name: --root
    value: PATH
    env: PROCESSKIT_ROOT
    applies_to: every command except version
    effect: selects the repository root; highest precedence in root
      selection; for init, names the directory to initialize
    requirements: [PK-CLI-008, PK-CLI-010, PK-CLI-011, PK-CLI-048]
  - name: --config
    value: PATH
    env: PROCESSKIT_CONFIG
    applies_to: every command
    effect: names the operator configuration file; without it no operator
      configuration is loaded
    basis: agent-proposal
    requirements: [PK-CONFIG-004]
  - name: --no-input
    applies_to: every command
    effect: non-interactive; no prompt is shown
    requirements: [PK-CLI-032]
  - name: --no-color
    env: NO_COLOR (any non-empty value)
    applies_to: every command
    effect: plain output without terminal control sequences
    requirements: [PK-CLI-026]
  - name: --log-level
    value: "debug | info | warning | error"
    env: PROCESSKIT_LOG_LEVEL
    default: warning
    applies_to: every command
    basis: agent-proposal
    requirements: [PK-OUT-003, PK-OUT-008]

scope_options:
  basis: agent-proposal (owner decision 2026-11-11, #212)
  options:
    - name: -n, --namespace
      value: N
      applies_to: [get, describe, create, validate, format, auth can-i]
      default: the root Container (namespace root, ontology@v1)
      requirements: [PK-CLI-051]
    - name: -A, --all-namespaces
      applies_to: get TYPE without NAME
      effect: every namespace; namespace is omitted from the MCP list call
      with_namespace: usage error, cli.conflicting-options
      requirements: [PK-CLI-051]
    - name: -l, --selector
      value: S
      grammar: ontology@v1 selectors
      applies_to: get TYPE without NAME
      requirements: [PK-CLI-049]
    - name: -f, --filename
      value: "PATH | -"
      repeatable: true
      applies_to: [validate, format, apply]
      effect: an item file, or every item file below a directory; "-" reads
        one draft from standard input (validate and apply only, at most once)
      with_type_or_name: usage error, cli.conflicting-options
      requirements: [PK-CLI-043, PK-CLI-053, PK-CLI-054]

writing_options:
  - name: --dry-run
    value: "none | client | server"
    value_optional: true; --dry-run alone means client
    default: none (the command runs)
    applies_to: [init, create, apply, format, lock, migrate, fetch]
    client: the plan is printed (and carried in `plan` with -o json or
      yaml) and nothing is written; `changes` is empty; failed Git-state
      checks are warnings; exit 0 unless the plan cannot be computed
    server: as client, and every check of a real run before confirmation
      runs and fails as in a real run (committed targets PK-CLI-036,
      validation of the planned content, for fetch the resolution of refs
      over the network); stops before confirmation and before any write
    invalid_value: usage error, cli.invalid-option-value
    check: repository files and the local cache are byte-identical before
      and after the command
    precedence: a dry run wins over --yes
    basis: agent-proposal (owner decision 2026-11-11, #212)
    requirements: [PK-CLI-004, PK-CLI-031, PK-CLI-036, PK-CLI-052]
  - name: --yes
    applies_to: [init, create, apply, format, lock, migrate, fetch]
    effect: confirms the plan without a prompt, interactive or not
    check: without --yes in a non-interactive run, a plan that requires
      confirmation is refused with cli.confirmation-required (exit 4) and no
      file changes
    requirements: [PK-CLI-014, PK-CLI-033, PK-CLI-034]

environment:
  - name: PROCESSKIT_ROOT
    effect: selects the repository root when --root is absent
    precedence: below --root, above discovery of processkit.toml
    requirements: [PK-CLI-008, PK-CLI-011]
  - name: PROCESSKIT_CONFIG
    effect: operator configuration file when --config is absent
    basis: agent-proposal
    requirements: [PK-CONFIG-004]
  - name: PROCESSKIT_LOG_LEVEL
    effect: log level when --log-level is absent
    basis: agent-proposal
    requirements: [PK-OUT-008]
  - name: NO_COLOR
    effect: plain output when set to a non-empty value
    requirements: [PK-CLI-026]
  - name: other PROCESSKIT_* variables
    effect: none; each is reported as warning
      cli.unknown-environment-variable
    basis: agent-proposal
    requirements: [PK-CONFIG-008]

environment_rules:
  secrets: no option and no PROCESSKIT_ variable accepts a secret value
  precedence: an option wins over the environment variable for the same key
  requirements: [PK-CLI-025, PK-CONFIG-006]

commands:
  - name: init
    synopsis: processkit init [--governing | --project]
    options:
      - {name: --governing, meaning: initialize a governing repository}
      - {name: --project, meaning: initialize a project repository}
    default: --project (basis agent-proposal)
    conflicting: --governing with --project is a usage error,
      cli.conflicting-options
    writes: repository files (configuration, content directory, the
      processkit block in .gitignore)
    confirmation: always (PK-CLI-034)
    root_when_none_found: current directory, as is (not the working-copy top
      level)
    already_initialized: refused, cli.already-initialized (exit 4)
    semantics_owner: repository-storage@v1 (PK-STORE-060)
    check: processkit.toml and the content directory exist; the plan lists
      exactly the files created; no Git state changed
    requirements: [PK-PROD-005, PK-CLI-004, PK-CLI-006, PK-CLI-008,
                   PK-CLI-012, PK-CLI-013, PK-CLI-034, PK-CLI-037,
                   PK-CLI-038]
  - name: create
    synopsis: processkit create TYPE NAME [-n N]
    arguments:
      - {name: TYPE, meaning: content kind (type_names)}
      - {name: NAME, meaning: item name}
    writes: repository files (one item)
    confirmation: only when the plan overwrites an existing file (PK-CLI-014)
    semantics_owner: content-kinds@v1
    check: the created file validates with processkit validate
    requirements: [PK-PROD-012, PK-CLI-004, PK-CLI-014, PK-CLI-049]
  - name: apply
    synopsis: processkit apply -f FILE|DIR|- [-f ...]
    options:
      - {name: -f, value: "PATH | -", repeatable: true, required: true}
    writes: repository files (creates or replaces items; never deletes)
    confirmation: when the plan replaces an existing file (PK-CLI-014)
    location: repository-storage@v1 assigns the path from kind, namespace,
      and name
    invalid_document: validation failure; no file written
    unchanged_document: not in the plan
    semantics_owner: repository-storage@v1, content-kinds@v1
    check: after apply, processkit get TYPE NAME -o json returns the
      applied content; a second apply of the same documents plans nothing
    basis: agent-proposal (owner decision 2026-11-11, #212)
    requirements: [PK-PROD-012, PK-CLI-004, PK-CLI-014, PK-CLI-053,
                   PK-CLI-054]
  - name: validate
    synopsis: processkit validate [TYPE [NAME...]] [-n N] [-f PATH|-]...
    arguments:
      - {name: TYPE, meaning: "validate every item of the kind; with
           -f -, the kind of the draft"}
      - {name: NAME, meaning: validate only the named items}
    options:
      - name: -f
        value: "PATH | -"
        meaning: an item file or a directory (every item file below it);
          "-" reads one draft from standard input; not combinable with
          another -f or with NAME (cli.conflicting-options)
    default_without_type_and_file: the whole selected repository (project
      configuration, every item in the content directory, references,
      overrides, the lock)
    writes: nothing
    mcp_equivalent: validate(kind, content)
    semantics_owner: content-kinds@v1
    check: draft content read from "-f -" is validated and no file is
      written; result and diagnostics equal those of the MCP validate tool
      for the same content
    basis: agent-proposal
    requirements: [PK-PROD-005, PK-PROD-012, PK-CLI-001, PK-CLI-002,
                   PK-CLI-042, PK-CLI-043]
  - name: format
    synopsis: processkit format [TYPE [NAME...]] [-n N] [-f PATH]...
    default_without_type_and_file: every item in the content directory
      (basis agent-proposal)
    writes: repository files (rewrites existing items)
    confirmation: when the plan overwrites a file (always, if it changes
      anything)
    semantics_owner: repository-storage@v1 (PK-STORE-050)
    check: a second run changes no file; existing files are overwritten only
      after confirmation
    requirements: [PK-CLI-004, PK-CLI-014, PK-CLI-036, PK-CLI-043]
  - name: get TYPE
    synopsis: processkit get TYPE [-l S] [-n N | -A] [--limit N]
      [--cursor C] [--excluded]
    options:
      - {name: -l / --selector, value: S}
      - {name: -n / --namespace, value: N}
      - {name: -A / --all-namespaces}
      - {name: --limit, value: N, basis: agent-proposal}
      - {name: --cursor, value: C, basis: agent-proposal}
      - {name: --excluded, value: none, basis: agent-proposal,
         effect: also list pin-excluded items (mcp-context-serving@v1
         PK-MCP-072)}
    writes: nothing
    mcp_equivalent: list(kind, selector?, namespace?, limit?, cursor?,
      excluded?)
    semantics_owner: mcp-context-serving@v1
    requirements: [PK-PROD-005, PK-CLI-001, PK-CLI-002, PK-CLI-005,
                   PK-CLI-040, PK-CLI-049, PK-CLI-051]
  - name: get TYPE NAME
    synopsis: processkit get TYPE NAME [-n N] [--level L] [--section S]
    names: exactly one NAME; more is a usage error, cli.unexpected-argument
    options:
      - {name: -n / --namespace, value: N, basis: agent-proposal}
      - {name: --level, value: L}
      - {name: --section, value: S}
    writes: nothing
    mcp_equivalent: get(kind, name, namespace?, level?, section?)
    semantics_owner: mcp-context-serving@v1
    requirements: [PK-PROD-005, PK-CLI-001, PK-CLI-002, PK-CLI-005,
                   PK-CLI-040, PK-CLI-049, PK-CLI-051]
  - name: get context
    synopsis: processkit get context [--task T] [--profile P]...
      [--path PATH]... [--kind K]... [--level L] [--excluded]
    options:
      - {name: --task, value: T}
      - {name: --profile, value: P, repeatable: true}
      - {name: --path, value: PATH, repeatable: true}
      - {name: --kind, value: K, repeatable: true, basis: agent-proposal}
      - {name: --level, value: L, values: [0, 1], default: 0,
         basis: agent-proposal}
      - {name: --excluded, value: none, basis: agent-proposal,
         effect: also list pin-excluded items (mcp-context-serving@v1
         PK-MCP-072)}
    names: none; a NAME is a usage error, cli.unexpected-argument
    writes: nothing
    principal: local (access-control@v1)
    mcp_equivalent: get_context(task?, profiles?, paths?, kinds?, level?,
      excluded?)
    semantics_owner: mcp-context-serving@v1
    check: data is byte-identical to the result a stdio MCP server started
      by the same user returns for the same arguments
    requirements: [PK-PROD-005, PK-CLI-001, PK-CLI-002, PK-CLI-005,
                   PK-CLI-007, PK-CLI-040, PK-CLI-041]
  - name: describe
    synopsis: processkit describe TYPE NAME [-n N]
    options:
      - {name: -n / --namespace, value: N, basis: agent-proposal}
    writes: nothing
    mcp_equivalent: explain(kind, name, namespace?)
    semantics_owner: inheritance@v1
    reports: [provenance, overrides, applicability basis, validation status]
    requirements: [PK-PROD-005, PK-CLI-001, PK-CLI-002, PK-CLI-005,
                   PK-CLI-040]
  - name: lock
    synopsis: processkit lock [--update] [UPSTREAM...]
    options:
      - {name: --update, meaning: re-resolve refs; a flag without value}
    arguments:
      - {name: UPSTREAM, repeatable: true, only_with: --update,
         meaning: upstreams to update (inheritance@v1); without UPSTREAM,
         --update updates every upstream}
    upstream_without_update: usage error, cli.unexpected-argument
    writes: repository files (the lock)
    network: none; resolves only from the local cache
    missing_fetched_data: environment failure, cli.upstream-not-fetched,
      fix "run processkit fetch"; the lock is not written
    confirmation: when processkit.lock exists and changes (PK-CLI-014)
    semantics_owner: inheritance@v1
    requirements: [PK-PROD-005, PK-CLI-004, PK-CLI-014, PK-CLI-044]
  - name: fetch
    synopsis: processkit fetch
    writes: local cache only
    network: yes; with the shared server the only network use
      (security@v1 PK-SEC-005)
    plan: plan.changes is empty (no repository file); what is fetched is
      reported in data (inheritance@v1)
    semantics_owner: inheritance@v1
    check: no repository file changes; only the local cache changes
    requirements: [PK-CLI-004]
  - name: api-resources
    synopsis: processkit api-resources
    writes: nothing
    mcp_equivalent: ontology()
    text_columns: concept name, plural, short name, definition or instance
    semantics_owner: ontology@v1
    requirements: [PK-PROD-005, PK-CLI-001, PK-CLI-002, PK-CLI-040]
  - name: explain
    synopsis: processkit explain TYPE
    arguments:
      - {name: TYPE, meaning: a concept name, or a kind's plural or short
           name (type_names)}
    writes: nothing
    mcp_equivalent: ontology(concept)
    semantics_owner: ontology@v1
    requirements: [PK-PROD-005, PK-CLI-001, PK-CLI-002, PK-CLI-040,
                   PK-CLI-049]
  - name: auth
    synopsis: processkit auth whoami | processkit auth can-i VERB TYPE
      [NAME] --as USER [--as-group G]... [-n N]
    subcommands: [whoami, can-i]
    arguments_and_output: access-control@v1
    writes: nothing
    semantics_owner: access-control@v1
    requirements: [PK-PROD-005, PK-CLI-002]
  - name: mcp serve --stdio
    synopsis: processkit mcp serve --stdio [--profile NAME]...
    options:
      - {name: --profile, value: NAME, repeatable: true,
         effect: pins profiles (mcp-context-serving@v1)}
    stdout: MCP protocol only; -o is a usage error
    writes: nothing
    semantics_owner: mcp-context-serving@v1
    requirements: [PK-PROD-005, PK-CLI-030]
  - name: mcp serve --http
    synopsis: processkit mcp serve --http --listen ADDRESS [--profile NAME]...
    options:
      - {name: --listen, value: ADDRESS}
      - {name: --profile, value: NAME, repeatable: true,
         effect: pins profiles (mcp-context-serving@v1)}
    stdout: nothing; -o is a usage error
    writes: nothing
    semantics_owner: access-control@v1
    requirements: [PK-PROD-005, PK-CLI-030]
  - name: migrate
    synopsis: processkit migrate [--from v0]
    options:
      - {name: --from, value: v0}
    writes: repository files
    confirmation: always (PK-CLI-034)
    semantics_owner: v0-migration@v1
    requirements: [PK-CLI-004, PK-CLI-012, PK-CLI-013, PK-CLI-014,
                   PK-CLI-034]
  - name: config view
    synopsis: processkit config view
    writes: nothing
    data: schemas/config-report.schema.json
    check: with -o json, every supported key appears once with its source;
      no secret value appears in stdout or stderr
    requirements: [PK-CONFIG-003, PK-CONFIG-007, PK-OUT-004]
  - name: version
    synopsis: processkit version
    writes: nothing
    repository: not required; root and revision are null
    data: schemas/version.schema.json
    json_fields: [release, sourceCommit, ontologyVersion,
                  contentApiVersions, mcpProtocolVersions,
                  mcpToolContractVersion, resultContractVersion,
                  lockFormatVersion]
    field_sources:
      PK-OUT-005: [release, sourceCommit, ontologyVersion,
                   contentApiVersions, mcpProtocolVersions]
      PK-COMPAT-001: [contentApiVersions (content apiVersion),
                      ontologyVersion, mcpToolContractVersion,
                      resultContractVersion, lockFormatVersion]
    values_owned_by:
      ontologyVersion: ontology@v1
      contentApiVersions: repository-storage@v1, content-kinds@v1
      mcpToolContractVersion: mcp-context-serving@v1
        (mcp.processkit.projectious.work/v1)
      mcpProtocolVersions: mcp-context-serving@v1 (2025-06-18, 2025-11-25)
      lockFormatVersion: inheritance@v1
        (lock.processkit.projectious.work/v1, the lock's apiVersion)
      resultContractVersion: cli@v1 (cli.processkit.projectious.work/v1)
    text_output: human projection; contains every value of the JSON data;
      layout is not a contract
    basis: agent-proposal
    requirements: [PK-OUT-005, PK-OUT-010]

mcp_mapping:
  # CLI operand or option -> MCP tool argument. An option that is not
  # given is omitted from the call, so the MCP default applies, except
  # namespace: without -n the CLI passes the root Container's namespace,
  # and with -A it omits namespace (PK-CLI-051).
  rule: data equals the tool's structured result; diagnostics equal the
    tool's diagnostics
  principal: local (access-control@v1); same as a stdio server started by
    the same operating-system user
  entries:
    - {cli: get TYPE, mcp: list.kind}
    - {cli: get TYPE -l S, mcp: list.selector}
    - {cli: "get TYPE -n N, else root; omitted with -A", mcp: list.namespace}
    - {cli: get TYPE --limit N, mcp: list.limit}
    - {cli: get TYPE --cursor C, mcp: list.cursor}
    - {cli: get TYPE --excluded, mcp: list.excluded}
    - {cli: get TYPE NAME, mcp: "get.kind and get.name"}
    - {cli: "get TYPE NAME -n N, else root", mcp: get.namespace}
    - {cli: get TYPE NAME --level L, mcp: get.level}
    - {cli: get TYPE NAME --section S, mcp: get.section}
    - {cli: get context --task T, mcp: get_context.task}
    - {cli: get context --profile P (each in order),
       mcp: get_context.profiles}
    - {cli: get context --path PATH (each in order), mcp: get_context.paths}
    - {cli: get context --kind K (each in order), mcp: get_context.kinds}
    - {cli: get context --level L, mcp: get_context.level}
    - {cli: get context --excluded, mcp: get_context.excluded}
    - {cli: describe TYPE NAME, mcp: "explain.kind and explain.name"}
    - {cli: "describe -n N, else root", mcp: explain.namespace}
    - {cli: "validate -f - (standard input, UTF-8)", mcp: validate.content}
    - {cli: "validate TYPE -f -, else the draft's kind field",
       mcp: validate.kind}
    - {cli: api-resources, mcp: ontology()}
    - {cli: explain TYPE, mcp: "ontology.concept (TYPE resolved to the
       concept name)"}
  type_resolution: TYPE is resolved to the exact kind or concept name
    (type_names) before the call
  basis: agent-proposal
  requirements: [PK-CLI-001, PK-CLI-007, PK-CLI-040, PK-CLI-041,
                 PK-CLI-049, PK-CLI-051]

writing_commands:
  repository_files: [init, create, apply, format, lock, migrate]
  local_cache_only: [fetch]
  all_other_commands: write nothing
  order_of_steps:
    - compute the plan (inputs and target digests bound)
    - print the plan (`plan` with -o json or yaml; in text mode on standard
      output with a dry run, else on standard error)
    - with --dry-run=client, stop; exit 0
    - committed-target check (repository-storage@v1 PK-STORE-056); on
      failure refuse, exit 4
    - with --dry-run=server, run the remaining checks of a real run, then
      stop
    - confirmation when required (prompt, or --yes); on failure refuse,
      exit 4
    - staleness check; on failure cli.plan-stale, exit 4
    - write; report `changes`
  check: after any other command, repository files and the local cache are
    unchanged
  requirements: [PK-CLI-004, PK-CLI-013, PK-CLI-014, PK-CLI-031,
                 PK-CLI-034, PK-CLI-035, PK-CLI-036, PK-CLI-052]

git_boundary:
  never: [stage, commit, push, open pull requests]
  check: index, HEAD, refs, and remotes are unchanged after every command
  requirements: [PK-CLI-006]

offline_reads:
  sources: [committed files, the lock, the local cache]
  network: none for read commands and for lock
  missing_upstream_fetch:
    code: cli.upstream-not-fetched
    category: environment
    exit_code: 3
    reports: the missing upstream and the fix (run processkit fetch)
  requirements: [PK-CLI-005, PK-CLI-044]

exit_codes:
  codes:
    - code: 0
      category: success
      meaning: no diagnostic with severity error
    - code: 1
      category: validation
      meaning: content, a draft, project or operator configuration, or the
        lock violates a contract
    - code: 2
      category: usage
      meaning: the invocation is invalid (unknown command or option, missing
        or unexpected operand, invalid or conflicting option value)
    - code: 3
      category: environment
      meaning: something outside the invocation and the content is missing
        or unusable (no repository root, unfetched upstream, unreadable
        file, unavailable log sink, network failure in fetch, failed write)
    - code: 4
      category: refused
      meaning: a precondition for writing does not hold and nothing was
        written (stale plan, missing or declined confirmation, uncommitted
        target, already initialized)
    - code: 5
      category: internal
      meaning: a processkit defect
    - code: 130
      category: cancelled
      meaning: interrupted by SIGINT
    - code: 143
      category: cancelled
      meaning: terminated by SIGTERM
  priority: [cancelled, internal, usage, environment, refused, validation]
  warnings_change_exit_code: false
  basis: agent-proposal
  requirements: [PK-CLI-003, PK-CLI-005, PK-CLI-013, PK-CLI-014,
                 PK-CLI-027, PK-CLI-028, PK-CLI-029, PK-CLI-036]

result_envelope:
  schema: schemas/result-envelope.schema.json
  apiVersion: cli.processkit.projectious.work/v1
  kind: Result
  members: [apiVersion, kind, command, outcome, root, revision, data,
            diagnostics, plan (writing commands), changes (writing
            commands)]
  outcome_values:
    succeeded: exit code 0
    refused: exit code 4
    cancelled: exit codes 130 and 143
    partial: exit code 3 or 5 after at least one file was changed
    failed: every other non-zero exit code
  revision_shape: repository-storage@v1 schemas/revision.schema.json
  change_shape: repository-storage@v1 schemas/file-change.schema.json
  count_per_invocation: 1
  stream: standard output
  unknown_members: not allowed; consumers reject an unknown apiVersion
  basis: agent-proposal
  requirements: [PK-CLI-002, PK-CLI-031, PK-OUT-001, PK-OUT-002,
                 PK-OUT-006]

plan:
  schema: schemas/plan.schema.json
  fields: [operation, root, release, inputs, changes, confirmationRequired]
  digest_format: sha256 followed by a colon and 64 lowercase hex digits;
    null for an absent path
  lifetime: one invocation; never saved, never accepted as input; no time
    limit
  basis: agent-proposal
  requirements: [PK-CLI-012, PK-CLI-013, PK-CLI-031, PK-CLI-035]

diagnostics:
  schema: schemas/diagnostic.schema.json
  required: [code, severity, category, scope, message]
  optional: [file, pointer, constraint, evidence, fix, nextAction]
  code_form: "<area>.<condition> in lowercase, for example cli.plan-stale"
  severities: [error, warning, info]
  categories: [validation, usage, environment, refused, internal,
               cancelled]
  next_actions: [fix-invocation, fix-content, fix-configuration, run-fetch,
                 commit-or-stash, confirm, rerun, report-defect]
  text_form: on standard error, always; contains severity, code, and
    message; the fix, if any, is the last line
  basis: agent-proposal
  requirements: [PK-CLI-001, PK-CLI-028, PK-OUT-002, PK-OUT-007]

errors:
  # Diagnostic codes owned by cli@v1, as code: category (or severity for
  # codes that are never errors). Codes of other areas (for example
  # storage.*) are defined by their specifications.
  owned:
    cli.unknown-command: usage
    cli.unknown-option: usage
    cli.missing-argument: usage
    cli.unexpected-argument: usage
    cli.invalid-option-value: usage
    cli.conflicting-options: usage
    cli.option-not-applicable: usage
    cli.root-not-found: environment
    cli.root-normalized: info (severity; never an error)
    cli.upstream-not-fetched: environment (nextAction run-fetch)
    cli.config-unreadable: environment
    cli.config-unknown-key: validation
    cli.config-invalid-value: validation
    cli.config-forbidden-key: validation (project configuration sets an
      authenticator, credential, listen address, executable, or limit
      (security@v1 PK-SEC-019); or an upstream URL carries user
      information (security@v1 PK-SEC-028))
    cli.config-version-unsupported: validation
    cli.unknown-environment-variable: warning (severity; never an error)
    cli.log-sink-unavailable: environment
    cli.io-error: environment (a file or directory cannot be read)
    cli.plan-stale: refused (nextAction rerun)
    cli.confirmation-required: refused (nextAction confirm)
    cli.confirmation-declined: refused
    cli.already-initialized: refused
    cli.internal-error: internal (nextAction report-defect)
    cli.interrupted: cancelled
  requirements: [PK-CLI-005, PK-CLI-008, PK-CLI-010, PK-CLI-013,
                 PK-CLI-014, PK-CLI-022, PK-CLI-027, PK-CLI-029, PK-CLI-030,
                 PK-CLI-033, PK-CLI-034, PK-CLI-035, PK-CLI-038, PK-CLI-042,
                 PK-CLI-044, PK-CLI-048, PK-CONFIG-001, PK-CONFIG-002,
                 PK-CONFIG-004, PK-CONFIG-005, PK-CONFIG-008, PK-OUT-008,
                 PK-CLI-049, PK-CLI-050, PK-CLI-051, PK-CLI-052, PK-CLI-054,
                 PK-CLI-055]
  cli_side_of_other_codes:
    - code: storage.target-not-committed
      owner: repository-storage@v1 (PK-STORE-056)
      category: refused
      exit_code: 4
      next_action: commit-or-stash
      with_dry_run_client: severity warning; exit code 0
      with_dry_run_server: as in a real run; exit code 4
      requirements: [PK-CLI-036, PK-CLI-052]
    - code: storage.write-failed
      owner: repository-storage@v1 (PK-STORE-057)
      category: environment
      exit_code: 3
      outcome: partial when a file was already changed
      requirements: [PK-OUT-006]
  basis: agent-proposal

interactivity:
  interactive_when: standard input is a terminal and --no-input is absent
  prompt_stream: standard error
  accepted_answers: ["y", "yes"]   # any letter case
  other_answer_or_end_of_input: refused, cli.confirmation-declined
  non_interactive_without_yes: refused, cli.confirmation-required
  confirmation_required:
    always: [init, migrate]
    when_plan_overwrites_replaces_or_deletes: [create, apply, format, lock]
    never: [fetch]   # writes only the local cache
  output_format_does_not_change_interactivity: true
  requirements: [PK-CLI-014, PK-CLI-032, PK-CLI-033, PK-CLI-034]

streams:
  stdout: results (text, or exactly one envelope with -o json or yaml); MCP
    protocol only for mcp serve --stdio
  stderr: [text diagnostics, text-mode plans of runs that may write,
           prompts, operational logs (default sink)]
  color: none when stdout is not a terminal, NO_COLOR is non-empty, or
    --no-color is given
  requirements: [PK-OUT-002, PK-OUT-003, PK-OUT-007, PK-CLI-026]

logging:
  format: JSON Lines, schemas/log-record.schema.json
  levels: [debug, info, warning, error]
  default_level: warning
  level_precedence: [--log-level, PROCESSKIT_LOG_LEVEL, operator
                     logging.level, warning]
  sinks:
    stderr: default
    file: operator logging.sink = "file" and logging.file = absolute path;
      appended; processkit does not rotate
  sink_failure: cli.log-sink-unavailable, environment failure, before the
    command does anything else
  not_evidence: logs may be lost; nothing depends on them as proof
  basis: agent-proposal
  requirements: [PK-OUT-003, PK-OUT-008]

redaction:
  applies_to: [logs, diagnostics, errors, config view]
  redacted: [bearer material, certificates,
             values matching configured secret patterns]
  patterns_key: redaction.patterns (operator configuration; list of
    regular expressions, Python re syntax)
  replacement: "[REDACTED]"
  check: a seeded secret of each class never appears in stdout, stderr, or
    any log sink
  requirements: [PK-OUT-004, PK-OUT-009, PK-CONFIG-003]

configuration:
  schema: closed and versioned for every configuration file
  version_key: schema-version = 1 (top level, every configuration file)
  unknown_key: fails, cli.config-unknown-key (validation failure)
  layers:   # lowest precedence first
    - name: project
      file: processkit.toml in the repository root
      committed: true
      carries: [content directory, profiles, document sources, upstreams,
                override winners, briefing budget]
      keys_owned_by: [repository-storage@v1, inheritance@v1,
                      mcp-context-serving@v1, content-kinds@v1]
      forbidden: [authenticators, credentials, listen addresses, executables,
                  limits]
    - name: operator
      file: named by --config or PROCESSKIT_CONFIG only; no implicit
        location
      carries: [listen address, TLS material, authenticators,
                imported access rules, limits, log sinks]
      keys_owned_here:
        - {key: schema-version, type: integer, value: 1}
        - {key: logging.level, type: string,
           values: [debug, info, warning, error], default: warning}
        - {key: logging.sink, type: string, values: [stderr, file],
           default: stderr}
        - {key: logging.file, type: string, meaning: absolute path; required
             when logging.sink is file}
        - {key: redaction.patterns, type: list of strings, default: []}
      other_keys_owned_by: [access-control@v1, security@v1,
                            mcp-context-serving@v1, inheritance@v1]
    - name: invocation
      sources: [options (highest), PROCESSKIT_ environment variables]
  layer_order_note: project and operator keys are disjoint (PK-CONFIG-002),
    so their order never decides a value
  report: schemas/config-report.schema.json; sources default, project,
    operator, environment, flag
  basis: agent-proposal
  requirements: [PK-CONFIG-001, PK-CONFIG-002, PK-CONFIG-003,
                 PK-CONFIG-004, PK-CONFIG-005, PK-CONFIG-006,
                 PK-CONFIG-007]

root_selection:
  order:
    - --root
    - PROCESSKIT_ROOT
    - nearest ancestor of the current directory, including itself, that
      contains processkit.toml
  none_found:
    init: current directory, as is
    other_commands: fail, cli.root-not-found (exit 3)
  never:
    - search configured lists of roots
    - cross a filesystem boundary implicitly
    - select a descendant of the current directory
    - choose between repositories by basename
  filesystem_boundary: a directory whose device ID (st_dev) differs from
    that of the directory below it on the search path; discovery stops
    there; only --root and PROCESSKIT_ROOT cross it
  content_directory_as_root: when the named directory has no
    processkit.toml and is exactly the configured content directory of its
    nearest ancestor with processkit.toml, that ancestor is selected and
    cli.root-normalized (info) is reported first; otherwise
    cli.root-not-found
  resolved_before: any other project configuration; not changed afterwards
    by environment or invocation layers
  requirements: [PK-CLI-008, PK-CLI-009, PK-CLI-010, PK-CLI-011,
                 PK-CLI-038, PK-CLI-039, PK-CLI-048]

plans:
  binds: [selected repository root, operation, processkit release,
          digest of every input and target path]
  stale_plan: refused with cli.plan-stale if any bound input or target path
    changed after planning; checked after confirmation, immediately before
    the first write; no file written
  confirmation:
    required_when: the plan overwrites, replaces, or deletes an existing
      file; always for init and migrate
    non_interactive: only --yes confirms; otherwise refused, no file written
  committed_targets: repository-storage@v1 PK-STORE-056; no bypass option
    (owner decision #213 finding 4)
  related: PK-STORE-021, PK-STORE-022, PK-STORE-057 of repository-storage@v1
  check: modify a bound input between planning and confirmation; the
    command refuses and every file is byte-identical
  requirements: [PK-CLI-004, PK-CLI-012, PK-CLI-013, PK-CLI-014,
                 PK-CLI-035, PK-CLI-036]

files:
  - path: processkit.toml
    role: project configuration; root marker for root discovery
    requirements: [PK-CLI-008, PK-CONFIG-001, PK-CONFIG-002]
  - path: .gitignore (repository root)
    role: receives the processkit block from init; created if absent
    block: |
      # BEGIN processkit (managed block; do not edit)
      /.processkit/
      # END processkit
    placement: appended at the end of the file when no block exists; an
      existing block is rewritten in place
    check: running init's update twice yields byte-identical content;
      content outside the block is byte-identical to before
    basis: agent-proposal
    requirements: [PK-CLI-015, PK-CLI-037]

supported_targets:
  release_targets:
    - {os: linux, arch: x86_64}
    - {os: linux, arch: arm64}
    - {os: macos, arch: x86_64}
    - {os: macos, arch: arm64}
  windows: not a release target in v1; no Windows artifact is published
  python: [CPython 3.12, CPython 3.13, CPython 3.14]
  tested_matrix: section "Tested platforms" of the release notes, one row
    per tested operating system and version, architecture, and Python
    version
  portability:
    never_assumed: [a shell, GNU userland, writable home directory,
                    ambient Git credentials]
  evidence:
    - every supported Python minor version and release target has
      pre-release test results
    - filesystem-sensitive behavior tested on case-sensitive and
      case-insensitive filesystems where the target offers both
    - path, locking, replacement, signal, and terminal differences from
      Linux tested by black-box tests on the differing target
  requirements: [PK-CLI-016, PK-CLI-017, PK-CLI-018, PK-CLI-019, PK-CLI-020,
                 PK-CLI-045, PK-CLI-046, PK-CLI-047]

open: []
